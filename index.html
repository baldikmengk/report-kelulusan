/* Jurusan */views.jur=()=>{const s=D.sekolah[0],ref=D.ref.filter(r=>r.jenjang===s.jenjang); $('v').innerHTML=`<div class="card"><h2>Jurusan ${s.jenjang}</h2><table>${s.jurusan.map(j=>`<tr><td class="l">${e(j)}</td><td><button class="b" data-j="${e(j)}" onclick="edJ(this.dataset.j)">Edit</button> <button class="b" style="background:#b42318" data-j="${e(j)}" onclick="hpJ(this.dataset.j)">Hapus</button></td></tr>`).join('')}</table> <h3>Tambah jurusan</h3><input id="nj" list="rl" size="40" placeholder="Pilih dari referensi atau ketik baru"><datalist id="rl">${ref.map(r=>`<option value="${e(r.nama)}">`).join('')}</datalist> <button class="b" onclick="tbJ()">Tambah</button></div>`;};function tbJ(){api('tambahJurusan',[T,$('nj').value],()=>refresh('jur'));}function hpJ(j){const n=D.laporan.filter(r=>r.jurusan===j).length;if(confirm('Hapus jurusan "'+j+'"?'+(n?' Data lulusan jurusan ini ('+n+' data tahun) juga akan terhapus.':'')))api('hapusJurusan',[T,j],()=>refresh('jur'));}function edJ(j){const b=prompt('Ubah nama jurusan:',j);if(b&&b!==j)api('editJurusan',[T,j,b],()=>refresh('jur'));}/* Unduh Excel / PDF */views.unduh=()=>{$('v').innerHTML=`<div class="card"><h2>Unduh Laporan</h2><label>Tahun: ${yearSel('ut','',1)}</label><p> <button class="b" onclick="unduh('x')">Unduh Excel</button><button class="b" onclick="unduh('p')">Unduh PDF</button></p></div>`;};function susun(th){const adm=U.role==='admin',lp=D.laporan.filter(r=>!th||r.tahun===th).sort((a,b)=>a.tahun-b.tahun),S={};D.sekolah.forEach(s=>S[s.npsn]=s); const jd='Laporan Kelulusan '+(adm?'SMA/SMK Gunungkidul':D.sekolah[0].nama)+' '+(th||yrs()[0]+'-'+yrs()[yrs().length-1]); const cols=['Lulus L','Lulus P','Lulus Jml','Tidak Lulus L','Tidak Lulus P','Tidak Lulus Jml','Jumlah Total'], nilai=r=>[r.laki,r.perempuan,r.laki+r.perempuan,r.tl_laki,r.tl_perempuan,r.tl_laki+r.tl_perempuan,r.laki+r.perempuan+r.tl_laki+r.tl_perempuan]; return adm?{jd,head:['NPSN','Sekolah','Jenjang','Kapanewon','Tahun','Jurusan'].concat(cols),body:lp.map(r=>{const s=S[r.npsn]||{};return[r.npsn,s.nama,s.jenjang,s.kapanewon,r.tahun,r.jurusan].concat(nilai(r));})} :{jd,head:['Tahun','Jurusan'].concat(cols),body:lp.map(r=>[r.tahun,r.jurusan].concat(nilai(r)))};}function unduh(f){const x=susun(+$('ut').value||0);if(!x.body.length){alert('Belum ada data untuk diunduh.');return;} const nama=x.jd.replace(/[^\w-]+/g,'_'); if(f==='x'){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([x.head].concat(x.body)),'Lulusan');XLSX.writeFile(wb,nama+'.xlsx');} else{const d=new jspdf.jsPDF({orientation:x.head.length>5?'l':'p'});d.setFontSize(12);d.text(x.jd,14,14);d.autoTable({head:[x.head],body:x.body,startY:20,styles:{fontSize:8}});d.save(nama+'.pdf');}}/* Admin: tambah tahun */views.thn=()=>{$('v').innerHTML=`<div class="card"><h2>Tambah Tahun</h2><p>Tahun yang ditambahkan di sini otomatis muncul di Dashboard, Entri Lulusan, dan Unduh pada semua satuan pendidikan.</p><p>Tahun saat ini: <b>${yrs().join(', ')}</b></p><input id="nt" type="number" min="2000" max="2100" placeholder="Contoh: 2027" onkeydown="if(event.key==='Enter')tbT()"> <button class="b" onclick="tbT()">Tambah</button></div>`;};function tbT(){const y=+$('nt').value;if(!Number.isInteger(y)||y<2000||y>2100){alert('Masukkan tahun yang valid (2000-2100).');return;}if(yrs().indexOf(y)>-1){alert('Tahun '+y+' sudah ada.');return;}api('tambahTahun',[T,y],()=>{alert('Tahun '+y+' berhasil ditambahkan.');refresh('thn');});}/* Admin: import data sekolah */views.imp=()=>{$('v').innerHTML=`<div class="card"><h2>Import Data Sekolah</h2> <p>Format file CSV (pemisah titik koma): <b>Nama Satuan Pendidikan;NPSN;Jenjang;Kapanewon;Jurusan</b>. Jurusan lebih dari satu dipisah titik koma dan ditulis dalam tanda kutip. SMA yang kolom jurusannya kosong diisi IPA, IPS, Bahasa.</p> <p>NPSN baru ditambahkan beserta akun (password awal = NPSN). NPSN yang sudah ada hanya diperbarui datanya.</p> <p><button class="b" onclick="tplSek()">Unduh Template</button></p> <p><input type="file" id="fi" accept=".csv,.txt"></p><p><button class="b" onclick="imp2()">Import</button></p><p id="im"></p></div>`;};function tplSek(){const t='\uFEFFNama Satuan Pendidikan;NPSN;Jenjang;Kapanewon;Jurusan\r\nSMAN 1 CONTOH;12345678;SMA;Wonosari;"IPA;IPS;Bahasa"\r\nSMK CONTOH;87654321;SMK;Playen;"Akuntansi; Teknik Otomotif"\r\n'; const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='template-sekolah.csv';a.click();}function imp2(){const f=$('fi').files[0];if(!f){alert('Pilih file CSV terlebih dahulu.');return;} const r=new FileReader();r.onload=()=>{$('im').textContent='Memproses...'; api('importSekolahCsv',[T,r.result],x=>{$('im').innerHTML=`<span class="ok">Selesai: ${x.baru} sekolah baru, ${x.diperbarui} diperbarui, ${x.dilewati} baris dilewati, ${x.jurusan_baru} jurusan referensi baru.</span>`;api('getData',[T],d=>D=d);});}; r.readAsText(f,'UTF-8');}/* Admin: import rekap lulusan */views.imr=()=>{$('v').innerHTML=`<div class="card"><h2>Import Rekap Lulusan 2021-2026</h2> <p>Format file CSV (pemisah titik koma): <b>NPSN;Tahun;Jurusan;Laki-laki;Perempuan</b>, satu baris untuk setiap sekolah, tahun, dan jurusan. Laki-laki dan Perempuan dibaca sebagai jumlah <b>Lulus</b>. Kolom opsional di sebelah kanan: <b>Tidak Lulus Laki-laki</b> dan <b>Tidak Lulus Perempuan</b>.</p> <p>Data dengan NPSN, tahun, dan jurusan yang sama akan ditimpa. Jurusan yang belum ada di sekolah ditambahkan otomatis. Data tampil di Dashboard satuan pendidikan, dan sekolah bisa mengubahnya lewat Entri Lulusan.</p> <p><button class="b" onclick="tplRekap()">Unduh Template</button></p> <p><input type="file" id="fr" accept=".csv,.txt"></p><p><button class="b" onclick="imr2()">Import</button></p><p id="ir"></p></div>`;};function tplRekap(){const t='\uFEFFNPSN;Tahun;Jurusan;Laki-laki;Perempuan\r\n20402126;2021;IPA;80;95\r\n20402126;2021;IPS;60;70\r\n20402098;2021;Bisnis Digital;25;40\r\n'; const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='template-rekap-lulusan.csv';a.click();}function imr2(){const f=$('fr').files[0];if(!f){alert('Pilih file CSV terlebih dahulu.');return;} const r=new FileReader();r.onload=()=>{$('ir').textContent='Memproses...'; api('importRekapCsv',[T,r.result],x=>{$('ir').innerHTML=`<span class="ok">Selesai: ${x.baru} data baru, ${x.diperbarui} diperbarui, ${x.dilewati} baris dilewati, ${x.jurusan_baru} jurusan ditambahkan ke sekolah.</span>`;api('getData',[T],d=>D=d);});}; r.readAsText(f,'UTF-8');}/* Admin: reset password */views.reset=()=>{$('v').innerHTML=`<div class="card"><h2>Reset Password Sekolah</h2><p>Password dikembalikan ke NPSN, sekolah disarankan menggantinya setelah login.</p><input id="rq" placeholder="Cari nama atau NPSN" oninput="reset2()"><div id="rc"></div></div>`;reset2();};function reset2(){const q=$('rq').value.toLowerCase(); $('rc').innerHTML='<table>'+D.sekolah.filter(s=>(s.nama+s.npsn).toLowerCase().includes(q)).map(s=>`<tr><td class="l">${e(s.nama)}</td><td>${s.npsn}</td><td><button class="b" onclick="rs('${s.npsn}')">Reset</button></td></tr>`).join('')+'</table>';}function rs(n){if(confirm('Reset password NPSN '+n+'?'))api('resetPassword',[T,n],()=>alert('Password direset menjadi NPSN.'));}/* Ubah password */views.pw=()=>{$('v').innerHTML=`<div class="card"><h2>Ubah Password</h2> <p><input id="p0" type="password" placeholder="Password lama"></p><p><input id="p1" type="password" placeholder="Password baru (min. 6 karakter)"></p><p><input id="p2" type="password" placeholder="Ulangi password baru"></p> <button class="b" onclick="pw2()">Simpan Password</button></div>`;};function pw2(){if($('p1').value!==$('p2').value){alert('Password baru tidak sama.');return;} api('ubahPassword',[T,$('p0').value,$('p1').value],()=>{alert('Password berhasil diubah.');U.wajib=false;views.pw();});}</script></body></html>
